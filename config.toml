theme = "dracula"

[editor]
auto-format = false
rulers = [80, 120]
trim-trailing-whitespace = true
trim-final-newlines = true

[editor.file-picker]
hidden = false
git-ignore = false

[keys.normal.space]
L = ":theme alucard"
D = ":theme dracula"
Y = ":sh printf %{buffer_name} | pbcopy"
U = ":sh printf \"$(pwd)/%{buffer_name}\" | pbcopy"
M = ":set-language markdown"
W = ":toggle soft-wrap.enable"
